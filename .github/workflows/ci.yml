name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tracked-file hygiene
        run: bash scripts/check-hygiene.sh
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Verify (lint, types, boundaries, tests, content, web build, native bundles)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm (corepack, version from packageManager)
        run: corepack enable && pnpm --version
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Verify
        run: pnpm verify
      - name: Native bundle smoke (iOS + Android Metro export)
        run: pnpm smoke:native && pnpm check:bundle:native
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Web smoke (Playwright, phone viewports; uses web export from verify)
        run: pnpm test:e2e

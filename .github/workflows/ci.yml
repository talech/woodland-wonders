name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tracked-file hygiene
        run: bash scripts/check-hygiene.sh
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Verify (lint, types, boundaries, tests, content, web build, native bundles)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm (corepack, version from packageManager)
        run: corepack enable && pnpm --version
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Verify
        run: pnpm verify
      - name: Native bundle smoke (iOS + Android Metro export)
        run: pnpm smoke:native && pnpm check:bundle:native
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Web smoke (Playwright, phone viewports; uses web export from verify)
        run: pnpm test:e2e

      - name: Export GitHub Pages build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          pnpm build:web
          pnpm check:bundle
          cp apps/game/dist/web/index.html apps/game/dist/web/404.html
          touch apps/game/dist/web/.nojekyll
        env:
          WW_WEB_BASE_URL: /woodland-wonders
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/game/dist/web

  deploy:
    name: Publish phone playtest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [hygiene, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
